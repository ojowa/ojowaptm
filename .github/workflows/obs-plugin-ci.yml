name: OBS Plugin CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'obs-plugin/**'
      - '.github/workflows/obs-plugin-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'obs-plugin/**'
      - '.github/workflows/obs-plugin-ci.yml'

env:
  CMAKE_VERSION: '3.25'
  OBS_PORT: 8765

jobs:
  build-linux:
    name: Build OBS Plugin (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libobs-dev \
            libwebsocketpp-dev \
            libssl-dev \
            pkg-config

      - name: Verify OBS headers
        run: |
          ls /usr/include/obs-module.h /usr/include/obs.h || true
          dpkg -l | grep libobs || true

      - name: Configure CMake
        working-directory: obs-plugin
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON

      - name: Build OBS plugin
        working-directory: obs-plugin
        run: cmake --build build --config Release -j$(nproc)

      - name: Verify plugin binary
        run: |
          find obs-plugin/build -name "*.so" -o -name "*.dll" | xargs ls -la || true

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojowaptm-obs-plugin-linux
          path: |
            obs-plugin/build/*.so
          retention-days: 30

  build-windows:
    name: Build OBS Plugin (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install CMake
        uses: lukka/run-cmake@v5
        with:
          cmakeListsTxt: obs-plugin/CMakeLists.txt
          buildDirectory: ${{runner.workspace}}/obs-plugin/build
          configurePreset: ''
          buildPreset: ''
          buildType: Release
          installPrefix: ''
          cmakeMinimumRequiredVersion: 3.20

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojowaptm-obs-plugin-windows
          path: |
            obs-plugin/build/*.dll
            obs-plugin/Release/*.dll
          retention-days: 30