name: Android CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.js'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.js'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/android-ci.yml'

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: 33
  ANDROID_BUILD_TOOLS: '33.0.0'
  ANDROID_MIN_SDK: 23
  ANDROID_TARGET_SDK: 33
  NDK_VERSION: '21.4.7075529'
  APK_ARTIFACT_NAME: ojowaPTM-android-debug-apk

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK Command Line Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK Platforms
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-${{ env.ANDROID_COMPILE_SDK }}"
          sdkmanager "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Install dependencies
        run: npm install

      - name: Install Gradle via SDKMAN
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.5
          echo "GRADLE_USER_HOME=$HOME/.gradle" >> $GITHUB_ENV

      - name: Build Android Debug APK
        working-directory: android
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          gradle assembleDebug

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  publish-release:
    name: Publish Android GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ./dist

      - name: Get release version
        shell: pwsh
        run: |
          $version = "1.0.0"
          if ($env:GITHUB_REF -match "refs/tags/v?(.+)") { $version = $matches[1] }
          Write-Host "Release version: $version"
          echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          release_name: "ojowaPTM Android v${{ env.RELEASE_VERSION }}"
          body: |
            ## ojowaPTM Android v${{ env.RELEASE_VERSION }}

            Phone as Mic for OBS — Android APK release.

            ### Installation
            1. Download `app-debug.apk`
            2. Install on your Android device (enable "Install from unknown sources" if needed)
            3. Connect phone and PC to the same WiFi
            4. Open the app, enter your OBS PC IP address, and tap START STREAMING
            5. In OBS, add "ojowaPTM Microphone" as an audio source

            ### Protocol
            Streams 48kHz s16le mono PCM over TCP port 8765 to the ojowaPTM OBS plugin.
          files: ./dist/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-android:
    name: Lint Android Code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx,.js --max-warnings 0 || true