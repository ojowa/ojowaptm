plugins {
    id "com.android.application"
    id "com.facebook.react"
}

import com.android.build.OutputFile

react {
    entryFile = file("../../index.js")
}

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.ojowacam.ojowaPTM"
    defaultConfig {
        applicationId "com.ojowacam.ojowaPTM"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    splits {
        abi {
            reset()
            enable true
            universalApk false
            include "armeabi-v7a", "x86_64", "arm64-v8a", "x86"
        }
    }
    signingConfigs {
        release {
            storeFile file("../ojowaptm-release-key.jks")
            storePassword "ojowaptm123"
            keyAlias "ojowaptm"
            keyPassword "ojowaptm123"
        }
    }
    buildTypes {
        debug {
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    implementation "org.webkit:android-jsc:+"
    implementation project(":react-native-tcp-socket")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
